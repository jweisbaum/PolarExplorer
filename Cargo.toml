[workspace]
resolver = "3"
members = [
    "crates/pe-core",
    "crates/pe-polar",
    "crates/pe-orc",
    "crates/pe-tracks",
    "crates/pe-trackers",
    "crates/pe-env",
    "crates/pe-grib",
    "crates/pe-app",
    "tools/orc-catalogue-builder",
]

[workspace.package]
version = "0.3.8"
edition = "2024"
rust-version = "1.97"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
pe-core = { path = "crates/pe-core" }
pe-polar = { path = "crates/pe-polar" }
pe-orc = { path = "crates/pe-orc" }
pe-tracks = { path = "crates/pe-tracks" }
pe-trackers = { path = "crates/pe-trackers" }
pe-env = { path = "crates/pe-env" }
pe-grib = { path = "crates/pe-grib" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Release profile favours export and blending, which are CPU-bound and allowed
# to be slow to compile. See spec.md 13.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Dev builds still need polar math and sampling to be usable interactively.
#
# `profile.dev.package."*"` covers dependencies only -- it does *not* reach the
# workspace's own crates, which is where the polar math and sampling live.
# Without the `[profile.dev]` entry below, VectorEffects' equivalent hot path
# ran about 2.4x slower under `tauri dev` than in release, for no reason anyone
# would guess from the config.
#
# `debug = "line-tables-only"` keeps file and line numbers in backtraces but
# drops full DWARF: the target directory is several times smaller, which the
# development machine's disk needs, and a debugger is rarely what finds a bug
# in this code base.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
# Rust 1.97.1 on Intel macOS can leave unresolved internal `.llvm.*` symbols
# after an optimised incremental rebuild, including in pe-core. Apply the
# workaround to every workspace crate, not just pe-app. Tests inherit this
# profile; ordinary `tauri dev` now also matches CI and the UI test driver.
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Keep IPC glue unoptimised for faster compilation. Polar math, blending,
# sampling and geodesy remain in optimised library crates.
[profile.dev.package.pe-app]
opt-level = 0
