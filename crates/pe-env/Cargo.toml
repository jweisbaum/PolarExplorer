[package]
name = "pe-env"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PolarExplorer reanalysis archive readers and sampling (network)."

[dependencies]
pe-core = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
# Whirlwind's v3 shards: asynchronous S3 reads and pure-Rust decoding/signing.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = "0.3"
ruzstd = "0.8"
half = "2.7"
crc32c = "0.6"
hmac = "0.12"
sha2 = "0.10"
bytes = "1"

# The archive is read over HTTPS with reqwest. reqwest's `rustls` feature
# selects the aws-lc-rs provider, a C library; `rustls-no-provider`
# plus our own ring-backed `ClientConfig` (`net.rs`) keeps the build pure
# Rust on all five targets (CLAUDE.md, D6).
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[features]
# The fixture archive and loopback S3 stub (`whirlwind::testing`), for other
# crates' integration tests. Never enabled by a build.
testing = []

[lints]
workspace = true
