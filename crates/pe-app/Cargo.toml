[package]
name = "pe-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PolarExplorer desktop application."
# Development utilities live in examples/ so Tauri bundles only the app.
default-run = "pe-app"

[lib]
name = "pe_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pe-app"
path = "src/main.rs"

[dependencies]
whirlwind-mcp = { path = "../../vendor/whirlwind-mcp", version = "=0.1.0" }
pe-core = { workspace = true }
pe-polar = { workspace = true }
pe-orc = { workspace = true }
pe-tracks = { workspace = true }
pe-trackers = { workspace = true }
pe-env = { workspace = true }
pe-grib = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reuse one prepared substring matcher per query across the local vessel index.
memchr = "2"
# Platform config, data and cache directories (spec.md 3.4).
directories = "6.0.0"
thiserror = { workspace = true }
ts-rs = { workspace = true }
tauri = { version = "2.11.5", features = [] }
# Native Open / Save As / folder pickers (spec.md 3.1, 3.4).
tauri-plugin-dialog = "2.7.3"
# End-to-end automation, never in a shipped build.
tauri-plugin-webdriver-automation = { version = "0.1.3", optional = true }

# Calendar dates: the scrape schedules, scraped races' times and the MCP guide's today.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Stable ids for scraped races and boats, so a re-scrape replaces its own records.
uuid = { version = "1", features = ["v5"] }

# The SYRF database's read-only metadata download (asked 2026-10-06): the
# native PostgreSQL protocol and platform-verified TLS; no libpq, no sidecar.
# Only `library::database` connects, only when the person presses the button.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"

# The MCP service (spec.md 3.7, D29). Pure Rust, always compiled in; the
# listener exists only while the setting is on (invariant 4's one inbound
# exception). As VectorEffects' `ve-app`.
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
tokio-util = "0.7"
getrandom = "0.3"
base64 = "0.22"
# Adding the service to Codex edits its `config.toml` in place, keeping
# every other line.
toml_edit = "0.25"
# The Claude Desktop extension and the skill archive are zip files.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# WebDriver automation for agent-driven UI tests (macOS), off by default.
# Copied from VectorEffects (D25).
#
# **The plugin binds a TCP listener.** It serves an axum WebDriver endpoint on
# `127.0.0.1` at a random port, printed to stdout, and that endpoint can click,
# type, screenshot and read the DOM — the whole interface, to any process on
# the machine that reads the port. Invariant 4 says nothing is fetched that the
# user did not ask for and nothing reaches in, and an inbound socket that
# drives the application is exactly what "nothing reaches in" rules out.
#
# So it is optional, and `npm run build` does not pass it: a release bundle
# contains no `axum` and opens no port. `npm run check:offline` cannot enforce
# that — it reads source URLs, bundle references and the CSP, not listeners —
# so the enforcement is that the dependency is not compiled in at all
# (`tests/webdriver_optional.rs`). The feature also gates the two
# automation seams in this crate: `PE_AUTOMATION_ROOT` (`paths.rs`) and
# `PE_DRIVER_YELLOWBRICK` (`trackers.rs`).
#
#   npm run dev:webdriver     # the app with the endpoint
#   npm run ux                # the agentic UX suite (tools/webdriver/ux)
#   cargo build -p pe-app --features webdriver
webdriver = ["dep:tauri-plugin-webdriver-automation"]

[dev-dependencies]
# The MCP service's tests drive a mock application over real HTTP with an
# `rmcp` client (`tests/mcp.rs`). `reqwest` without default features: no
# TLS at all is needed for loopback, and none is pulled in.
tauri = { version = "2.11.5", features = ["test"] }
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
# Pinning the export hashes the CI matrix compares (invariant 5, plan.md M14).
# Pure Rust, already in the lock file through Tauri.
sha2 = "0.10.9"
# The GRIB export's tests decode what it wrote with the test-only reader.
pe-grib = { workspace = true, features = ["testing"] }
# The GRIB export's tests read the fixture archive from pe-env's loopback S3
# stub.
pe-env = { workspace = true, features = ["testing"] }
# Unique temporary directories for the track library's tests.
uuid = { version = "1", features = ["v4", "v5"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
